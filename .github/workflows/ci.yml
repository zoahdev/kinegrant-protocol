name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit, schema, and security regression tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: kinegrant-demo > /tmp/kinegrant-demo.json && python -m json.tool /tmp/kinegrant-demo.json >/dev/null
      - name: Machine Permission Test
        run: kinegrant-mpt --source-commit "$GITHUB_SHA" --output /tmp/kinegrant-mpt.json >/dev/null && python challenge/verify_evidence.py /tmp/kinegrant-mpt.json
      - name: External reproduction packet
        run: python challenge/reproduce.py --source-commit "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/kinegrant-reproduction" && python challenge/verify_reproduction.py "$RUNNER_TEMP/kinegrant-reproduction/reproduction-report.json"
      - name: Publish independently verifiable reproduction packet
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: kinegrant-reproduction-${{ github.sha }}-python-3.12
          path: ${{ runner.temp }}/kinegrant-reproduction/
          if-no-files-found: error
          retention-days: 30
      - name: ESP32-C3 evidence verifier dry run
        run: python proof/verify_esp32c3_evidence.py proof/esp32-c3/physical-proof-evidence.template.json --allow-not-run
      - name: JavaScript verifier tests
        working-directory: implementations/kinegrant-js
        run: node --test test/verify.test.mjs
      - name: Go verifier tests
        working-directory: implementations/kinegrant-go
        run: go test ./...
      - name: CLI smoke tests
        run: |
          kinegrant-conformance >/tmp/conformance.json && python -m json.tool /tmp/conformance.json >/dev/null
          kinegrant-red-team >/tmp/redteam.json && python -m json.tool /tmp/redteam.json >/dev/null
          kinegrant-robot-demo >/tmp/robot.json && python -m json.tool /tmp/robot.json >/dev/null
          kinegrant-bridge-demo >/tmp/bridge.json && python -m json.tool /tmp/bridge.json >/dev/null

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify source distribution includes ESP32-C3 firmware
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archives = glob.glob("dist/*.tar.gz")
          if len(archives) != 1:
              raise SystemExit(f"expected one source distribution, found {archives}")

          required_suffixes = {
              "proof/esp32-c3/firmware/CMakeLists.txt",
              "proof/esp32-c3/firmware/sdkconfig.defaults",
              "proof/esp32-c3/firmware/main/CMakeLists.txt",
              "proof/esp32-c3/firmware/main/kgp_firmware.c",
              "proof/esp32-c3/firmware/components/monocypher/CMakeLists.txt",
          }
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
          missing = {
              suffix
              for suffix in required_suffixes
              if not any(name.endswith(suffix) for name in names)
          }
          if missing:
              raise SystemExit(f"firmware source missing from sdist: {sorted(missing)}")
          PY
