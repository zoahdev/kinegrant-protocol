name: send-email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pinned
        with:
          python-version: "3.12"
      - name: Send campaign
        run: python .github/send_email.py .github/campaign.json
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
