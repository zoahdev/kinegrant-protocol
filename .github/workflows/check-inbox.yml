name: check-inbox

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pinned
        with:
          python-version: "3.12"
      - name: Check inbox and notify
        run: python .github/outreach/check_inbox.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: "18377360711@163.com"
