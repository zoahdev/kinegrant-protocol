name: Fuzz

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fuzz-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Fuzz external adapters (deterministic, multiple seeds)
        run: |
          for seed in 1 2 3 4 5; do
            kinegrant-fuzz --seed "$seed" --iterations 200
          done
