[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kinegrant-protocol"
version = "2.65.5"
description = "Reference implementation of KineGrant, an authorization and accountability layer for physical AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "KineGrant contributors" }]
keywords = [
  "authorization",
  "robotics",
  "physical-ai",
  "capability",
  "receipts",
  "post-quantum",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://kinegrant.com"
Documentation = "https://kinegrant.com/paper/"
Source = "https://github.com/zoahdev/kinegrant-protocol"
Tracker = "https://github.com/zoahdev/kinegrant-protocol/issues"

[project.optional-dependencies]
test = ["jsonschema[format]>=4.23"]
hardware = ["pyserial>=3.5"]

[project.scripts]
kinegrant-demo = "kinegrant.cli:main"
kinegrant-serve = "kinegrant.server:main_serve"
kinegrant-init = "kinegrant.server:main_init"
kinegrant-mpt = "kinegrant.mpt:main"
kinegrant-robot-demo = "kinegrant.experimental.robot_demo:main"
kinegrant-bridge-demo = "kinegrant.experimental.bridge_demo:main"
kinegrant-ros2-demo = "kinegrant.experimental.ros2_demo:main"
kinegrant-audit = "kinegrant.audit:main"
kinegrant-revoke-distribute = "kinegrant.distribution:main"
kinegrant-policy-bundle = "kinegrant.policy_bundle:main"
kinegrant-red-team = "kinegrant.redteam:main"
kinegrant-conformance = "kinegrant.conformance:main"
kinegrant-fuzz = "kinegrant.fuzz:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["benchmarks", "fuzz"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
