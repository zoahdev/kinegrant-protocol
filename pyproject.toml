[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kinegrant-protocol"
version = "1.9.0"
description = "Reference implementation of KineGrant, an authorization and accountability layer for physical AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["jsonschema[format]>=4.23"]
hardware = ["pyserial>=3.5"]

[project.scripts]
kinegrant-demo = "kinegrant.cli:main"
kinegrant-mpt = "kinegrant.mpt:main"
kinegrant-robot-demo = "kinegrant.experimental.robot_demo:main"
kinegrant-bridge-demo = "kinegrant.experimental.bridge_demo:main"
kinegrant-ros2-demo = "kinegrant.experimental.ros2_demo:main"
kinegrant-audit = "kinegrant.audit:main"
kinegrant-revoke-distribute = "kinegrant.distribution:main"
kinegrant-red-team = "kinegrant.redteam:main"
kinegrant-conformance = "kinegrant.conformance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
